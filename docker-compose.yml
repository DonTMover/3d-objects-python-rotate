version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.webapp:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build: .
    command: python -m src.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_PUBLIC_URL:-http://caddy:80/}
      - PYTHONUNBUFFERED=1
    depends_on:
      - web
    volumes:
      - ./src:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://web:8000/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/templates:/usr/src/app/templates:ro
      - ./src/static:/usr/src/app/static:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - web
    restart: unless-stopped
    