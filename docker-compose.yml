version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.webapp:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app
    restart: unless-stopped

  bot:
    build: .
    # start ngrok + webapp + bot together inside container
    command: python -m src.serve_and_ngrok
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - PYTHONUNBUFFERED=1
    # serve_and_ngrok will start uvicorn itself; no depends_on required
    volumes:
      - ./src:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/templates:/usr/src/app/templates:ro
      - ./src/static:/usr/src/app/static:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - web
    restart: unless-stopped
    