version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.webapp:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app
    restart: unless-stopped

  bot:
    build: .
    command: python -m src.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL:-http://web:8000/}
      - PYTHONUNBUFFERED=1
    depends_on:
      - web
    volumes:
      - ./src:/app
    restart: unless-stopped

services:
  tg-bot:
    build: .
    container_name: tg-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=7579539691:AAFIFg1aA9WlsgbPhulw1h7dHWnHW2VN4ps
    