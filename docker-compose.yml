version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.webapp:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app
    restart: unless-stopped

  bot:
    build: .
    # start ngrok + webapp + bot together inside container
    command: python -m src.serve_and_ngrok
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - PYTHONUNBUFFERED=1
    # serve_and_ngrok will start uvicorn itself; no depends_on required
    volumes:
      - ./src:/app
    restart: unless-stopped

services:
  tg-bot:
    build: .
    container_name: tg-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=7579539691:AAFIFg1aA9WlsgbPhulw1h7dHWnHW2VN4ps
    